- insert:
    - id: workbuddy-accounts
      name: dsh-workbuddy-accounts
      config:
        backendPort: 7863
    # 复用 dsh-base 已挂载的 pi-ai LLM 适配器（同名 id 定向补丁，整段替换该行
    # config），把本机 wb2api 网关注册为 DSH 模型供应商：目录含思考强度与
    # 输入模态；管理密钥由插件运行时写入 DSH 凭证库 WB2API_GATEWAY_API_KEY。
    # 模型目录由 scripts/generate-dsh-provider-models.mjs 生成，网关目录变化后
    # 重新生成并更新插件。
    - id: llm-pi-ai
      name: "@deepseek-ai/dsh-llm-pi-ai"
      config:
        providers:
          workbuddy-gateway:
            displayName: "AI 工具箱网关"
            api: openai-completions
            baseURL: "http://127.0.0.1:7863/v1"
            apiKeyEnv: WB2API_GATEWAY_API_KEY
            defaultInput:
              - "text"
            models:
              - id: "cn:hy4free"
                name: "Hy4 · x0.29"
                contextWindow: 1000000
                maxTokens: 64000
                input:
                  - "text"
                  - "image"
                reasoningEfforts:
                  high: "high"
